defaults:
  - train_diffusion_transformer_mimicgen_d1_lowdim_abs_workspace
  - _self_

name: train_diffusion_transformer_mimicgen_d1_mug_cleanup_loc_tuned
exp_name: "baseline_tuned"
variant_name: "distance_weighted"

horizon: 24
n_obs_steps: 4
n_action_steps: 1

policy:
  use_distance_weighted_loss: True
  distance_weight_alpha: 3.0
  distance_weight_sigma: 0.06
  use_gripper_weighted_loss: True
  gripper_weight_alpha: 4.0
  gripper_weight_threshold: 0.03
  gripper_loss_min_weight: 1.0

task:
  env_runner:
    n_test: 12
    n_test_vis: 0
    n_envs: 4
    enable_render: False
  dataset:
    near_object_threshold: 0.08
    near_object_oversample_ratio: 4

dataloader:
  batch_size: 512
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 512
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True

training:
  resume: False
  enable_rollout: True
  num_epochs: 100
  rollout_every: 20
  checkpoint_every: 20

checkpoint:
  topk:
    monitor_key: test_task_success_rate
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_task_success_rate={test_task_success_rate:.4f}.ckpt'

multi_run:
  run_dir: ${oc.env:MYDIFFUSION_D1_OUTPUTS_DIR,mydiffusion_D1/outputs}/${task.name}/${exp_name}/${variant_name}/${training.seed}
  wandb_name_base: ${task_name}_${exp_name}_${variant_name}_seed${training.seed}
