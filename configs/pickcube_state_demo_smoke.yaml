experiment:
  name: "pickcube_state_baseline_smoke"
  seed: 42
  output_dir: "results/pickcube_state_baseline_smoke"

data:
  dataset_type: "maniskill_demo_npz"
  task_name: "PickCube-v1"
  demo_format: "npz"
  demo_root: "/path/to/pickcube_state_demos"
  train_split: 0.9
  obs_key: "observations"
  action_key: "actions"
  sequence_length: 8
  stride: 8
  obs_dim: 32
  action_dim: 8
  max_diffusion_step: 32
  noise_std: 0.05
  observation_mode: "state"
  control_mode: "pd_ee_delta_pose"
  expected_obs_rank: 3
  expected_action_rank: 3

model:
  hidden_dim: 64
  num_layers: 2
  num_heads: 2
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 16
  epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 10
  success_threshold: 0.20

evaluation:
  num_rollouts: 100
  save_plots: true
