experiment:
  name: "full_baseline_maniskill_template"
  seed: 42
  output_dir: "results/full_baseline_maniskill_template"

data:
  dataset_type: "maniskill_demo_npz"
  task_name: "PegInsertion-v1"
  demo_format: "npz"
  demo_root: "/path/to/maniskill/demos"
  train_split: 0.9
  obs_key: "observations"
  action_key: "actions"
  sequence_length: 16
  stride: 4
  obs_dim: 24
  action_dim: 8
  max_diffusion_step: 32
  noise_std: 0.05
  observation_mode: "state"
  expected_obs_rank: 3
  expected_action_rank: 3

model:
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 20
  success_threshold: 0.20

evaluation:
  num_rollouts: 100
  save_plots: true
