experiment:
  name: "mujoco_push_a3_seq12_stride1_attnres"
  seed: 7
  output_dir: "results/mujoco_push_a3_seq12_stride1_attnres"

data:
  dataset_type: "demo_npz"
  task_name: "mujoco_two_finger_push"
  demo_format: "npz"
  demo_root: "data/mujoco_two_finger_push_smoke_demos"
  train_split: 0.9
  obs_key: "observations"
  action_key: "actions"
  action_conditioning: "shifted_history"
  sequence_length: 12
  stride: 1
  obs_dim: 18
  action_dim: 4
  max_diffusion_step: 32
  noise_std: 0.05
  observation_mode: "state"
  control_mode: "joint_position"

model:
  residual_mode: "attnres"
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 64
  epochs: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 10
  success_threshold: 0.10

evaluation:
  num_rollouts: 20
  save_plots: true
  sampler_mode: "single_step"
  lock_gripper_open: true

environment:
  control_dt: 0.05
  physics_dt: 0.005
  episode_steps: 60
  success_distance: 0.05
  finger_open: 0.055
  goal_x_offset_range: [0.08, 0.14]
  goal_y_offset_range: [-0.04, 0.04]

demo_generation:
  num_episodes: 160
  minimum_steps: 8
