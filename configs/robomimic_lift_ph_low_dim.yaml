experiment:
  name: "robomimic_lift_ph_low_dim"
  seed: 42
  output_dir: "results/robomimic_lift_ph_low_dim"

data:
  dataset_type: "robomimic_demo_npz"
  task_name: "Lift"
  demo_format: "npz"
  demo_root: "data/robomimic_lift_ph_low_dim"
  train_split: 0.9
  obs_key: "observations"
  action_key: "actions"
  source_format: "robomimic_hdf5"
  source_obs_keys:
    - "robot0_eef_pos"
    - "robot0_eef_quat"
    - "robot0_gripper_qpos"
    - "object"
  flatten_obs: true
  sequence_length: 8
  stride: 2
  obs_dim: 19
  action_dim: 7
  max_diffusion_step: 32
  noise_std: 0.05
  observation_mode: "low_dim"
  expected_obs_rank: 3
  expected_action_rank: 3

model:
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 64
  epochs: 24
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 20
  success_threshold: 0.20

evaluation:
  num_rollouts: 50
  save_plots: true
