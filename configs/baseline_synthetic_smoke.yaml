experiment:
  name: "full_baseline_synthetic_smoke"
  seed: 42
  output_dir: "results/full_baseline_synthetic_smoke"

data:
  dataset_type: "synthetic"
  task_name: "PickCube-v1"
  train_size: 512
  val_size: 128
  obs_dim: 24
  action_dim: 8
  sequence_length: 16
  noise_std: 0.05
  max_diffusion_step: 32

model:
  hidden_dim: 64
  num_layers: 2
  num_heads: 2
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 10
  success_threshold: 0.20

evaluation:
  num_rollouts: 100
  save_plots: true
