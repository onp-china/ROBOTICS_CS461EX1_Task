experiment:
  name: "full_baseline_synthetic"
  seed: 42
  output_dir: "results/full_baseline_synthetic"

data:
  dataset_type: "synthetic"
  task_name: "PickCube-v1"
  train_size: 4096
  val_size: 1024
  obs_dim: 24
  action_dim: 8
  sequence_length: 16
  noise_std: 0.05
  max_diffusion_step: 32

model:
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1
  max_diffusion_step: 32

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 20
  success_threshold: 0.20

evaluation:
  num_rollouts: 100
  save_plots: true
